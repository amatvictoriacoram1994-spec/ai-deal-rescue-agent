<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800" role="img" aria-labelledby="title desc">
  <title id="title">AI Deal Rescue Agent architecture</title>
  <desc id="desc">Read-only evidence from HubSpot, Gmail, and Google Calendar is normalized into DealContext and scored deterministically. Claude explains already-scored results but does not score deals. Customer-safe transformation and explicit human approval precede Gmail draft creation. No automatic send path exists.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 19px; font-weight: 400; fill: #475569; }
      .section-label { font-size: 15px; font-weight: 700; letter-spacing: 2.2px; fill: #1d4ed8; }
      .node-title { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .node-copy { font-size: 17px; font-weight: 400; fill: #475569; }
      .small { font-size: 15px; font-weight: 600; fill: #475569; }
      .callout-title { font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: 0.4px; }
      .callout-copy { font-size: 17px; font-weight: 600; fill: #dbeafe; }
      .warning-title { font-size: 25px; font-weight: 800; fill: #991b1b; letter-spacing: 0.5px; }
      .warning-copy { font-size: 17px; font-weight: 700; fill: #b91c1c; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .evidence-arrow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1400" height="1800" rx="24" fill="#f8fafc"/>

  <text x="700" y="62" text-anchor="middle" class="title">AI Deal Rescue Agent</text>
  <text x="700" y="96" text-anchor="middle" class="subtitle">Reliability-first RevOps workflow with deterministic risk ownership and human-approved drafts</text>

  <text x="92" y="152" class="section-label">READ-ONLY EVIDENCE</text>
  <line x1="92" y1="166" x2="1308" y2="166" class="divider"/>

  <!-- Read-only evidence sources -->
  <g filter="url(#shadow)">
    <rect x="90" y="195" width="360" height="132" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="520" y="195" width="360" height="132" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="950" y="195" width="360" height="132" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="270" y="246" text-anchor="middle" class="node-title">HubSpot</text>
  <text x="270" y="278" text-anchor="middle" class="node-copy">Deal state and next step</text>
  <text x="270" y="305" text-anchor="middle" class="small">READ ONLY</text>

  <text x="700" y="246" text-anchor="middle" class="node-title">Gmail</text>
  <text x="700" y="278" text-anchor="middle" class="node-copy">Targeted sent-message evidence</text>
  <text x="700" y="305" text-anchor="middle" class="small">GMAIL.READONLY</text>

  <text x="1130" y="246" text-anchor="middle" class="node-title">Google Calendar</text>
  <text x="1130" y="278" text-anchor="middle" class="node-copy">Future primary-calendar meetings</text>
  <text x="1130" y="305" text-anchor="middle" class="small">CALENDAR EVENTS READ ONLY</text>

  <path d="M270 327 V370 H700 V410" class="evidence-arrow"/>
  <path d="M700 327 V410" class="evidence-arrow"/>
  <path d="M1130 327 V370 H700 V410" class="evidence-arrow"/>

  <!-- Normalization -->
  <g filter="url(#shadow)">
    <rect x="350" y="420" width="700" height="116" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="700" y="466" text-anchor="middle" class="node-title">Normalized DealContext</text>
  <text x="700" y="499" text-anchor="middle" class="node-copy">Deal facts + seller email timestamp + next meeting timestamp</text>
  <text x="700" y="523" text-anchor="middle" class="small">No raw connector responses cross this boundary</text>

  <path d="M700 536 V595" class="arrow"/>

  <!-- Deterministic boundary -->
  <rect x="70" y="575" width="1260" height="360" rx="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="102" y="615" class="section-label" fill="#4338ca">CODE-OWNED DECISION BOUNDARY</text>

  <g filter="url(#shadow)">
    <rect x="350" y="642" width="700" height="116" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  </g>
  <text x="700" y="689" text-anchor="middle" class="node-title">Deterministic Risk Engine</text>
  <text x="700" y="723" text-anchor="middle" class="node-copy">Explicit evaluation time + fixed rules + fixed weights</text>
  <text x="700" y="747" text-anchor="middle" class="small">Code-owned decision boundary</text>

  <path d="M700 758 V807" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="350" y="817" width="700" height="88" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  </g>
  <text x="700" y="854" text-anchor="middle" class="node-title">Severity Score + Risk Flags + Action Priority</text>
  <text x="700" y="883" text-anchor="middle" class="node-copy">Authoritative deterministic output</text>

  <rect x="1080" y="642" width="210" height="263" rx="18" fill="#1e3a8a"/>
  <text x="1185" y="700" text-anchor="middle" class="callout-title">CODE</text>
  <text x="1185" y="733" text-anchor="middle" class="callout-title">DECIDES RISK</text>
  <line x1="1110" y1="759" x2="1260" y2="759" stroke="#93c5fd" stroke-width="2"/>
  <text x="1185" y="800" text-anchor="middle" class="callout-copy">Severity</text>
  <text x="1185" y="830" text-anchor="middle" class="callout-copy">Risk flags</text>
  <text x="1185" y="860" text-anchor="middle" class="callout-copy">Action priority</text>

  <path d="M700 935 V984" class="arrow"/>

  <!-- Claude explanation -->
  <g filter="url(#shadow)">
    <rect x="350" y="994" width="700" height="132" rx="18" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  </g>
  <text x="700" y="1038" text-anchor="middle" class="node-title">Guarded Claude Explanation</text>
  <text x="700" y="1070" text-anchor="middle" class="node-copy">Explains risk + recommends an internal action</text>
  <text x="700" y="1100" text-anchor="middle" class="small">Already-scored structured data in · Fail-closed validation out</text>

  <rect x="1080" y="994" width="210" height="132" rx="18" fill="#581c87"/>
  <text x="1185" y="1040" text-anchor="middle" class="callout-title">CLAUDE</text>
  <text x="1185" y="1073" text-anchor="middle" class="callout-title">DOES NOT</text>
  <text x="1185" y="1106" text-anchor="middle" class="callout-title">SCORE DEALS</text>

  <path d="M700 1126 V1176" class="arrow"/>

  <!-- Safe transformation -->
  <g filter="url(#shadow)">
    <rect x="350" y="1186" width="700" height="126" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="700" y="1232" text-anchor="middle" class="node-title">Customer-Safe Email Transformation</text>
  <text x="700" y="1265" text-anchor="middle" class="node-copy">Deterministic flag-to-intent copy</text>
  <text x="700" y="1293" text-anchor="middle" class="small">Internal Claude recommendation never flows directly to the buyer</text>

  <path d="M700 1312 V1361" class="arrow"/>

  <!-- Approval -->
  <g filter="url(#shadow)">
    <rect x="350" y="1371" width="700" height="104" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <text x="700" y="1414" text-anchor="middle" class="node-title">Explicit Human Approval Gate</text>
  <text x="700" y="1447" text-anchor="middle" class="node-copy">Mandatory approval + human identity + matching deal ID</text>

  <path d="M700 1475 V1524" class="arrow"/>

  <!-- Compose write boundary -->
  <text x="92" y="1518" class="section-label" fill="#b45309">SEPARATE COMPOSE WRITE PATH</text>
  <line x1="92" y1="1532" x2="1308" y2="1532" class="divider"/>
  <g filter="url(#shadow)">
    <rect x="350" y="1550" width="700" height="112" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  </g>
  <text x="700" y="1593" text-anchor="middle" class="node-title">Gmail Compose</text>
  <text x="700" y="1626" text-anchor="middle" class="node-copy">DRAFTS.CREATE ONLY · Separate compose permission</text>
  <text x="700" y="1651" text-anchor="middle" class="small">Draft remains in Gmail for human review</text>

  <path d="M700 1662 V1702" class="arrow"/>

  <!-- Terminal no-send invariant -->
  <rect x="350" y="1710" width="700" height="66" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="700" y="1743" text-anchor="middle" class="warning-title">NO AUTO-SEND</text>
  <text x="700" y="1767" text-anchor="middle" class="warning-copy">NO messages.send · NO drafts.send</text>
</svg>
